<!-- 手机端：页面顶部的标题栏；md 及以上：左侧固定侧边栏 -->
<aside
  class="px-5 pt-6 pb-4 border-b border-[#a0c4ff] md:border-b-0 md:w-64 md:shrink-0 md:px-4 md:py-8 md:flex md:flex-col md:justify-between md:h-screen md:sticky md:top-0 md:overflow-y-auto"
>
  <div class="space-y-3 md:space-y-6">
    <div class="flex items-center gap-3 md:block">
      <a href="/" class="shrink-0 md:hidden">
        <img
          src="/coat_of_arms.webp"
          alt="coat of arms"
          width="320"
          height="372"
          class="w-14 h-auto"
        />
      </a>
      <div class="min-w-0">
        <h3 class="text-base tracking-wide mb-1 md:mb-2 font-bold">
          <span class="font-serif text-my-ultramarine">zzy040330.</span
          ><span class="font-sans text-my-pink">萌え</span>
        </h3>

        <div class="flex flex-wrap items-baseline gap-x-3 md:block">
          <h1
            class="text-3xl md:text-4xl text-my-ultramarine tracking-wide md:mb-2 font-bold"
          >
            無何有之鄉
          </h1>
          <p class="text-xs md:text-base text-gray-400 md:text-gray-500">
            ~本来无一物 何处惹尘埃~
          </p>
        </div>
      </div>
    </div>

    <div class="flex items-baseline justify-between gap-4 md:block md:space-y-6">
      <nav
        class="text-lg md:text-xl flex flex-wrap gap-x-4 gap-y-1 md:block md:space-y-2 text-my-ultramarine font-medium"
      >
        <a href="/" class="block hover:text-my-pink">首页</a>
        <a href="/categories/" class="block hover:text-my-pink">分类</a>
        <a href="/tags/" class="block hover:text-my-pink">标签</a>
        <a href="/posts/" class="block hover:text-my-pink">归档</a>
        <a href="/about/" class="block hover:text-my-pink">关于</a>
      </nav>

      <a
        href="/index.xml"
        class="block text-sm text-my-ultramarine hover:text-my-pink"
        aria-label="RSS 订阅"
        ><i class="fa-solid fa-rss"></i
        ><span class="hidden md:inline"> RSS 订阅</span>
      </a>
    </div>

    <div class="hidden md:block mt-6">{{ partial "sidebar-links.html" . }}</div>
  </div>

  <div class="hidden md:block">{{ partial "sidebar-footer.html" . }}</div>
</aside>
